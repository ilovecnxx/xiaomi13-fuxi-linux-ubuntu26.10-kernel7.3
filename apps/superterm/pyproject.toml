[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "superterm"
version = "0.1.0"
description = "SuperTerm — native super-smart terminal app driving codex/claude/dsh on the phone"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = []

[project.scripts]
superterm-headless = "superterm.headless:main"
superterm-gui = "superterm.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration"]
