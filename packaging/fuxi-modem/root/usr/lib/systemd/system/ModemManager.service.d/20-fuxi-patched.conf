# fuxi：改跑卡槽补丁版 ModemManager（work/patches/mm-simslot-20261030），避免双卡 SIM identifier changed 无限 reprobe。
# 二进制由 fuxi-modem 包提供（scripts/fuxi-modem-bin-pull.sh 从手机取，补丁见 work/patches/mm-*）。
# 临时回退到发行版 ModemManager：systemctl edit ModemManager，写 [Service] ExecStart= 和 ExecStart=/usr/sbin/ModemManager
[Service]
ExecStart=
ExecStart=/usr/libexec/fuxi/mm/src/ModemManager
StandardError=journal
