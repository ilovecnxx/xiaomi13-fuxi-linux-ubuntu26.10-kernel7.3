name: Maintenance Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * 1'
permissions:
  contents: read
concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.select.outputs.docs }}
      scripts: ${{ steps.select.outputs.scripts }}
      apps: ${{ steps.select.outputs.apps }}
      source: ${{ steps.select.outputs.source }}
      third_party: ${{ steps.select.outputs.third_party }}
      kernel: ${{ steps.select.outputs.kernel }}
      userspace: ${{ steps.select.outputs.userspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: select
        run: python3 scripts/fuxi-ci-plan.py
  docs:
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: bash scripts/fuxi-ci.sh docs
  host:
    needs: plan
    if: needs.plan.outputs.scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 python3-gi gir1.2-glib-2.0 dpkg-dev gnupg build-essential libglib2.0-bin libglib2.0-dev gnome-settings-daemon-common
      - run: bash scripts/fuxi-ci.sh scripts
  apps:
    needs: plan
    if: needs.plan.outputs.apps == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: bash scripts/fuxi-ci.sh apps
  source:
    needs: plan
    if: needs.plan.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Cache pinned kernel source archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: work/sources/
          key: kernel-archive-v1-${{ hashFiles('kernel/manifest.json') }}
      - run: python3 scripts/fuxi-kernel-source.py prepare
      - run: bash scripts/fuxi-ci.sh kernel-host
      - if: needs.plan.outputs.kernel == 'true'
        run: FUXI_CONTAINER_ENGINE=docker bash scripts/fuxi-build-env.sh image
      - if: needs.plan.outputs.kernel == 'true'
        run: FUXI_CONTAINER_ENGINE=docker bash scripts/fuxi-build-env.sh run bash scripts/fuxi-ci.sh kernel
      - if: needs.plan.outputs.kernel == 'true'
        run: FUXI_CONTAINER_ENGINE=docker bash scripts/fuxi-build-env.sh run bash scripts/fuxi-ci.sh bindings
  third_party:
    needs: plan
    if: needs.plan.outputs.third_party == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 scripts/fuxi-sources.py prepare
  userspace:
    needs: plan
    if: needs.plan.outputs.userspace == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 scripts/fuxi-sources.py prepare hexagonrpc modemmanager 81voltd libssc
      - run: FUXI_CONTAINER_ENGINE=docker FUXI_BUILD_ARCH=arm64 bash scripts/fuxi-build-env.sh image
      - run: FUXI_CONTAINER_ENGINE=docker FUXI_BUILD_ARCH=arm64 bash scripts/fuxi-build-env.sh run bash scripts/fuxi-ci.sh userspace
      - run: FUXI_CONTAINER_ENGINE=docker FUXI_BUILD_ARCH=arm64 bash scripts/fuxi-build-env.sh run env FUXI_APT_LOCAL=1 FUXI_APT_SUPPORT_ONLY=1 FUXI_APT_OUT=/src/work/ci-apt bash scripts/fuxi-build-pkgs.sh 0.0+ci
  checks:
    if: always()
    needs: [plan, docs, host, apps, source, third_party, userspace]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ['RESULTS'])
          assert results['plan']['result'] == 'success', 'check selection failed'
          outputs = results['plan']['outputs']
          required = 'docs scripts apps source third_party kernel userspace'.split()
          assert set(outputs) == set(required), 'missing or unknown check selection'
          assert set(outputs.values()) <= {'true', 'false'}, 'invalid check selection'
          for check in required:
              selected = outputs[check]
              if check == 'kernel':
                  assert selected != 'true' or outputs['source'] == 'true'
                  continue
              job = 'host' if check == 'scripts' else check
              expected = 'success' if selected == 'true' else 'skipped'
              actual = results[job]['result']
              assert actual == expected, f'{job}: expected {expected}, got {actual}'
          print('All selected checks passed')
          PY
